[MeleeStance]
; 1 = hook installed
Enabled=1
; script tag that puts a human in melee stance (the melee_toggle button adds/removes it)
Tag=melee_stance
; second tag that also means "in stance", for breed {tags} / mission triggers; the button never removes it
AlwaysTag=melee_always
; ammo {tag}s that count as melee; every other ammo is refused while the unit is in stance
MeleeAmmoTags=melee_light,melee_heavy,medium_inf_melee_target,medium_veh_melee_target,heavy_veh_melee_target
; 1 = units linked to something (vehicle crew, gunners, passengers) ignore the stance and the charge
SkipLinked=1
; 1 = ammo.set melee rows marked {ready_for_shot} also let a unit in stance draw the weapon from its belt
DrawFromBelt=1
; 0.7.11: 1 = a unit under direct control (manual control, the engine's own test) is left alone: no stance ammo filter, no charge,
; no auto-draw in CQC, no reload cancel, until the player releases it (0.7.12: also the unit the manual-control manager drives; skips logged)
SkipDirectControl=1
; 1 = turning the stance ON (melee_toggle) puts the melee weapon in hand ({take_item} in melee_toggle.set), and a charge by a stance unit
; that is not holding its melee weapon re-draws it before the attack order
DrawOnToggle=1
DrawButton=melee_toggle
; ms: no second take-item order for the same unit while the first may still be running (a re-added order restarts the take)
DrawCooldownMs=3000
; 1 = write gem_meleestance.log (install lines + the first 40 stance and 40 charge decisions)
Log=1

[Charge]
; 1 = units with melee weapons charge enemies they see (same attack order as a double-click)
Enabled=1
; script tag a unit needs to charge (units in melee stance always qualify)
Tag=has_melee_weapon
; 1 = only while the melee weapon is in hand (stance units always qualify)
MeleeInHand=1
; 1 = player-controlled units charge too, 0 = AI units only
PlayerUnits=1
; minimum age of the running order before a stalled unit is re-ordered (ms; 0.7.1: was the gate on every re-order at the same enemy)
CooldownMs=2000
; minimum time between any two charge orders, per unit (ms) - switching enemy, stall re-orders
RetargetMs=1500
; 0.7.9: a running charge at the SAME enemy may be re-aimed this soon after its last order (the run goal moved MoveRefreshUnits, or
; the unit got inside CloseDistance and takes the melee / attack order). Was behind RetargetMs 1500: units reacted late to enemies
; that moved (Alex).
RefreshMs=400
; one attack order per enemy: while the unit is still closing on the enemy it was sent at, nothing is re-issued (a new order
; restarts the running one: the unit stops and re-paths). Re-issued only when the unit stalls (0.7.1: it moved less than
; ProgressUnits itself and the distance closed by less, two one-second samples in a row, after CooldownMs; before, an enemy
; walking up counted as progress and units stood staring), the enemy is gone, or another enemy is closer than SwitchRatio x the
; current one. 0.7.1: a unit whose last order was the melee draw gets its run / melee order the moment the weapon is in hand.
SwitchRatio=0.6
ProgressUnits=10
; the charge itself: farther than CloseDistance (world units, 20 = 1 m) the unit gets the player's double-click move: a movement-mode
; order (RunMode: the engine's 0..3 modes, 2 = run; -1 = none) and then Order::eMoveTask to the enemy's spot (the double-click move;
; the single-click move is Order::eAdvance, the slow weapon-up walk, which forces mode 1), re-issued when the enemy moved MoveRefreshUnits
; from it; inside CloseDistance the attack_melee order (Order::eFight, what the attack_melee button gives); inside MinDistance nothing.
; An attack order on an enemy out of weapon reach does not make a stance unit approach.
; (0 = eFight from the start with no run phase: tried Nov 7 2026, worse than the run phase)
CloseDistance=200
MoveRefreshUnits=40
; 0.7.13: ... or this share of the current distance to the enemy, whichever is larger (0 = MoveRefreshUnits only). Every re-issued
; move restarts the run, so vs an enemy that keeps moving a 40-unit refresh every RefreshMs left units hanging 20-50 m off (Nov 8 log)
MoveRefreshFraction=0.4
RunMode=2
; farthest enemy to charge, in world units (20 = 1 m; 2000 = 100 m; 0 = any enemy the unit's scan sees)
MaxDistance=2000
; closer than this (world units) the unit is already fighting: no new order (stops order spam in melee)
MinDistance=60

[MultiSelect]
; 1 = {instant} buttons with {apply_to_all} (melee_toggle, overcharge, jetpack...) work on several selected units;
; vanilla only runs them when exactly one selected unit can use them
Enabled=1

[ShieldMelee]
; 1 = engine paired melee can start on a unit wearing a forcefield: the blow's attacker->target ray ignores
; hits on entities linked to the target (its shield, its kit) or carrying SeeThroughTag; walls/others still block
; 0 since 0.6.1 (Alex: back to 0.6 behaviour, no engine patch)
Enabled=0
SeeThroughTag=forcefield

[Downed]
; 1 = no weapon is chosen against a unit carrying Tag (bled-out / personage state), so the AI ignores downed units
; and melee units don't charge them
Enabled=1
Tag=start_personage

[BlowReach]
; engine paired melee (vanilla set\blow: fists, kick, rifle butt, knife, bayonet, sword): the attacker walks to
; within this distance of the target's centre, then the blow plays. World units; vanilla 17 / 29 / 35.
; Applies to every paired fight in the game (no per-target version). Enabled=0 = keep vanilla.
Enabled=1
Near=45
Medium=45
Far=45

[AutoDraw]
; 0.7: a human carrying a melee weapon with enemy infantry within Distance (world units, 20 = 1 m; 100 = the 5 m fight/distance
; of 40k_human.inc) is held in a temporary stance for HoldMs after the last such sighting: guns refused, melee weapon drawn
; (one take-item order for Item per DrawCooldownMs). When nobody is that close any more the hold runs out and the gun comes back.
; A unit whose melee weapon came out this way only charges enemies within 2 x Distance.
Enabled=1
Distance=100
HoldMs=3000
; 0 = AI-controlled units only
PlayerUnits=1
; the {item} word of the take-item order (same match as the melee_toggle button: the stuff\melee folder name)
Item=melee

[Vehicles]
; 0.7: units in melee stance (button or AlwaysTag) also melee vehicles. Hand-melee ammo carrying one of VehicleMeleeTags is
; allowed against a non-human actor for stance units only (every other unit is refused), and refused while the unit saw enemy
; infantry within [Charge] MaxDistance in the last InfantryMs, so infantry comes first. Needs ammo.set rows for these tags in
; the vehicle target classes. A unit whose current order is an attack on a vehicle stays on it: 0.7.1 the dll's own charge order
; counts too (before, any infantry seen pulled the weapon and the target away again, and units stood beside the tank), and other
; infantry only takes over when closer than SwitchRatio x the vehicle's distance. The close order on a vehicle is the
; double-click attack (Action::e_attack with the double-click flag, order+0xC1).
Enabled=1
VehicleMeleeTags=melee_light,melee_heavy
; 0.7.10: 500 (was 3000): after the last enemy infantryman nearby dies the vehicle melee is allowed this soon; 3000 made squads stare at a
; cannon for ~5 s (log: 20 refusals "infantry seen 5 ms ago", then the attack 4 s after the last melee order)
InfantryMs=500
; 0.7.8: only enemy infantry within InfantryRange (units) holds a stance unit off a vehicle (was [Charge] MaxDistance = 100 m: one live
; guardsman far away kept whole squads staring at a tank). 400 = 20 m.
InfantryRange=400
; 0.7.8: the run at a vehicle hands over to the attack order at this distance from its centre (the run goal is the centre, which the
; pather can't reach: a Russ stops the unit ~240 out, so [Charge] CloseDistance 200 was never reached and the unit stood watching).
; A run that stalls short of a vehicle also goes straight to the attack order.
CloseDistance=400
; 1 = the close part of a vehicle charge is the attack order (eAttack, double-click flag); 0 = eFight (the hand fight, may refuse vehicles)
CloseAttackOrder=1
; 0.7.3 hull contact: the engine measures weapon range unit -> target point (the body volume's CENTRE), so a 3.3 m sword can never be
; "in range" of a tank from its front (log: stalled at 88 units) and the unit pushes into the hull without swinging. A unit under a
; vehicle attack order that stands still (moved less than ProgressUnits in a second) closer than AdjacentMax units to the vehicle
; centre is taken as pressed against the hull: for AdjacentMs the stance filter hands the engine a target point half a metre in
; front of the unit (0.7.5; it is touching the plate, so that point is on it), the weapon fires and the swing lands.
; 0.7.6: once armed the unit stays armed for as long as its attack order on that vehicle runs and it is within 2 x AdjacentMax of the
; centre (0.7.5 re-armed only from a fresh stall, so every shove by the engine's approach dropped the range again and the units ran
; around the tank). AdjacentMax 120 = a Leman Russ from any side (log: 48-96), a Baneblade's side; a unit queued behind a friend at
; 155 does not arm (it would swing at air). 0 = off. Crews of guns / vehicles never count as "infantry seen" and are never charged
; (they can't be fought while linked).
AdjacentMs=1500
AdjacentMax=120
; 0.7.4: script tag that means "touching a vehicle": 40k_human.inc {on contact} adds it (1.5 s) when a unit with its melee weapon out
; touches a vehicle's "ram" volume; the hull-contact range shift then starts at once (the stall sample above stays as the fallback)
ContactTag=hull_contact

[ReloadCancel]
; 0.7.1: a melee draw (melee_toggle, auto-draw, charge) given while the unit is reloading cancels the reload (the engine's take-item
; order otherwise waits for the reload to end: "stuck holding the weapon"). Technically every running inventory op of the unit is
; dropped (Human::CancelInventoryOps, the same call the engine uses), which on the host also tells the clients.
Enabled=1
; item tags ({tag} of the stuff set / pattern) of weapons whose reload is NOT cancelled: the heavy weapons keep reloading and the
; draw waits as before. mgun = every machine-gun-pattern weapon (heavy stubbers, autocannons, assault cannon, meltaguns too);
; stubber / hmg_shell = IG stubbers; lascannon, plasmacannon + sm_weapon_plasmacannon, sm_weapon_heavybolter, rocketlauncher
; (rpg_weapon pattern), heavy_flamethrower, grenadelauncher, at_rifle, ogryn_weapon (ripper guns, ogryn stubbers).
; Plain flamers (flame_thrower), plasma guns, lasguns, bolters, pistols, shotguns swap at once.
KeepTags=mgun,hmg_shell,stubber,lascannon,plasmacannon,sm_weapon_plasmacannon,sm_weapon_heavybolter,rocketlauncher,heavy_flamethrower,grenadelauncher,at_rifle,ogryn_weapon
