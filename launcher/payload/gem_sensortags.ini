[SensorTags]
; 1 = an actor (human, vehicle, gun) carrying the tag below has its sensor off: sees and spots nothing
Enabled=1
; the tag (lowercase)
Tag=sensor_off
; 1 = log every sensor switched off / back on to gem_sensortags.log
Log=0
; how often each unit's tags are looked at for the tag, in ms (0 = every tick, as 0.1 did).
; A unit is always looked at on its first tick, so one that spawns tagged is blind at once;
; after that a tag added or removed takes up to this long to act.
CheckMs=1000

[NoTarget]
; 0.3. 1 = an actor carrying Tag is no target for enemies: their sensors do not mark it as attackable, so the AI
; does not go for it (the engine state a vehicle seat with {turnoff {targetable}} gives its crew).
; Script: {tags add "no_target"} / {tags remove "no_target"}; acts within CheckMs. Host only in MP, like the sensor tag.
; Only actors with a sensor of their own are looked at.
Enabled=1
Tag=no_target
