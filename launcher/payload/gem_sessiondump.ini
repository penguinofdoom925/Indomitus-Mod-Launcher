[SessionDump]
; 1 = write a minidump every time the game / editor / server ends (overwritten each session)
Enabled=0
; 0 = small (stacks, modules, handles; like the engine crash dump, ~3 MB)
; 1 = + global data + memory the stacks point at (default, tens to a few hundred MB)
; 2 = full memory (the whole process, several GB)
Level=1
; raw MINIDUMP_TYPE flags (hex, e.g. 0x1826); 0 = use Level
Type=0
; Ctrl+Alt+F12 with the game window in front = snapshot dump right now (snapshot.mdmp, overwritten)
Hotkey=1
; the exiting process waits at most this long for the dump
TimeoutMs=30000
; empty = log\minidumps (server: log_ds\minidumps) under the game config root whose log\game.log
;         is newest: Documents\my games\gates of hell or %LocalAppData%\digitalmindsoft\gates of hell
Dir=
; gem_sessiondump.log next to the dll
Log=1
