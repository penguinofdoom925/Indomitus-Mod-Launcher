; GEM Teleport settings. Lives next to gem_teleport.dll (the Indomitus launcher payload folder).
; Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe only.
; Every feature checks the engine code at startup; anything it does not recognise stays off and
; gem_teleport.log says so. The teleport changes game state: every player of a multiplayer match
; needs this DLL.
[teleport]

; ==== general ====
; 0 = nothing is patched
enabled=1
; gem_teleport.log next to the DLL
log=1
; console window with the same messages
console=0
; log every parsed {teleport}, every jump (first 50), refused orders and ignored damage (first 50 each)
verbose=1
; log fatal exceptions (with a stack scan)
crash_log=1
; also log C++ throws (the engine throws and catches a few at load - every GEM DLL would log the same ones)
log_cpp_exceptions=0

; ==== {teleport} instruction ====
; values used when an action file leaves a parameter out
; radius in metres around the soldier in which a ground click is accepted
default_max_radius=30
; seconds between the click (lock, "teleport_begin") and the move ("teleport_jump")
default_pre_use_delay=0.5
; seconds between the move and the release ("teleport_end")
default_post_use_delay=0.5
; metres: each soldier lands at a point scattered within this radius of the click (0 = all on the click point).
; Deterministic (hash of the unit's start position + the click), so all multiplayer peers agree.
default_spread=0
; 0.2: seconds of visible flight (unit moved along an arc every simulation tick); 0 = instant move as in 0.1
default_flight_time=0
; arc peak height = jump distance x arc_ratio, capped at arc_max metres
default_arc_ratio=0.2
default_arc_max=8
; turn the unit toward the landing point at take-off; degrees added (0/90/180/270) if the forward axis is not row y; -1 = no turn
default_face_offset=0
; distance band events fired before teleport_begin: teleport_short (< band_mid m), teleport_mid (< band_long m), teleport_long
default_band_mid=15
default_band_long=28
; 0.2.1: Entity::SetPos grounds humans, so the arc height is written into the matrix after it (1); 0 = SetPos only (flat)
lift=1
; 0.2.5: fire {on "teleport_aim"} on each selected unit while a {teleport} action's cursor is up (re-fired every 200 ms;
; local player only). The mod shows the min / max range rings from it. 0 = off
aim_events=1
; 0.2.11 MP diagnostic (log only): units aimed with / jumped are logged for 12 s - position steps, script tag changes,
; every named interaction event fired on them. Compare the client log with the server log (payload\server\). 0 = off
watch=0
; 0.2.12: in a network game the jump events (teleport_short/mid/long, _begin, _takeoff, _jump, _end, _cooldown) are also
; sent to every client the way the engine's own {effect "x"} instruction does it, so clients play the animation / fx / sounds.
; 0 = server only (0.2.11 and older: nothing visible on clients). The aim events stay local
net_events=1
; 0.2.10 cooldown: a unit carrying this script tag is refused - {on "teleport_cooldown"} fires on it and nothing else happens.
; The mod sets the tag for the cooldown time and removes it (40k_human.inc). Empty = no check
cooldown_tag=tp_cooldown
; entity script-tag vector offset (1.067: 0x4E8, the one GEM MeleeStance uses); only change after an engine update
ent_tags=0x4E8

; fire the interaction events {on "teleport_begin"} / {on "teleport_jump"} / {on "teleport_end"} on the soldier
events=1
; while teleporting (click .. release): new orders to the soldier are refused (Entity::GiveOrder)
lock_orders=1
; while teleporting: health_damage_* actions do nothing to the soldier (independent of lock_orders)
invulnerable=1
; multiplayer: everything in this section changes the simulation - all players must have the same values
; (the sealed launcher payload guarantees that)
