; GEM MeleeChase settings. Lives next to gem_meleechase.dll (the Indomitus launcher payload folder).
; Read by call_to_arms.exe, call_to_arms_ed.exe and call_to_arms_server.exe only.
; Every feature checks the engine code at startup; anything it does not recognise stays off and
; gem_meleechase.log says so. It changes AI decisions (simulation): every player of a
; multiplayer match needs this DLL.
; 0.5.0: vehicle-brain units (fauna, vehicles) only. Humans are not touched: the fight-distance multiplier
; (human_fight_distance / fight_distance_mult) is removed, infantry melee is GEM MeleeStance.
[meleechase]

; ==== general ====
; 0 = nothing is patched
enabled=1
; gem_meleechase.log next to the DLL
log=1
; console window with the same messages
console=0
verbose=1
; log fatal exceptions (with a stack scan) and who ends the process
crash_log=1
; log the first chase decisions (vehicle re-paths / stops)
log_chase=1

; ==== melee weapons ====
; a weapon is "melee" when its item carries this tag ({tag "... melee ..."} in its set/stuff file)
melee_tag=melee
; 0.5.1: a second word that also marks a weapon as melee, for VEHICLE weapons ("pattern gun" sets). Never put the
; word "melee" on a vehicle gun: the engine then applies the human Melee skill to it and the server crashes when the
; vehicle spawns. Empty = off.
vehicle_melee_tag=veh_melee

; ==== vehicles / fauna ====
; a vehicle-class unit with at least one melee weapon keeps re-planning its approach while the target moves
vehicle_chase=1
; re-plan when the point the unit drives to is off by more than repath_fraction x the distance to the target,
; clamped to repath_min_m..repath_max_m (far away a few metres don't matter, up close they do)
repath_fraction=0.25
repath_min_m=1
repath_max_m=10
; how often a running approach is checked (milliseconds of game time); closer than close_range_m: the faster interval
repath_interval_ms=500
repath_interval_close_ms=200
close_range_m=10

; ==== close combat (melee units) ====
; drive to this fraction of the melee reach instead of stopping at its edge (vanilla: 0.95)
contact_factor=0.5
; aim at where the target will be: its velocity x lead_seconds, at most lead_max_m
lead_seconds=0.6
lead_max_m=6
; keep pursuing a target that backs off faster than retreat_speed_mps, even while it is still inside weapon range
; (vanilla stands still until it is out of range, then starts a new approach)
pursue_retreating=1
retreat_speed_mps=0.3
; melee units (melee weapons only, or ai_prioritize_melee) chase whenever the target is outside 90% of their reach,
; instead of standing still until it leaves weapon range
chase_always=1
; movement mode the chase sets on the unit (the vanilla vehicle AI keeps whatever mode it has, often a walk).
; Values as in the player's move orders: 0 walk, 1 normal, 2 run, 3 fastest. -1 = don't change
chase_run_mode=2
; a unit with a melee weapon: its other (ranged) weapons hold fire while the target is inside melee reach x
; hold_ranged_reach_factor, so only the melee weapon attacks. Units with ai_prioritize_ranged are not affected.
hold_ranged_in_melee=1
hold_ranged_reach_factor=1.0
; 1 = a path ended for a re-plan does not brake the unit first (smoother); 0 = vanilla stop, then the new path
smooth_repath=1

; ==== weapon priority (vehicles / fauna with both melee and ranged weapons) ====
; put one of these props in the unit's def: {props "... ai_prioritize_melee"}
;   ai_prioritize_melee  : the AI drives in to its melee weapon's reach (charges; ranged weapons fire on the way)
;   ai_prioritize_ranged : the AI only closes to its ranged weapons' reach and holds there (melee only if the enemy comes close)
; without either prop the vanilla choice stays. Both on one unit: melee wins.
weapon_priority=1
prop_prioritize_melee=ai_prioritize_melee
prop_prioritize_ranged=ai_prioritize_ranged
