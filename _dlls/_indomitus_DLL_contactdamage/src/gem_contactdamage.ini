[ContactDamage]
; 1 = hook installed (the vehicle_health_damage_pierce action's Apply/GetDamage vtable slots)
Enabled=1
; {vehicle_health_damage_pierce} with no bullet (a contact handler) takes N hp off Component when the vehicle (self)
; or the effector carries the tag <TagPrefix><N>, e.g. melee_body_25. No such tag = nothing happens.
TagPrefix=melee_body_
Component=body
; 1 = also read the tag from the effector (the contactor) when the vehicle has none
ReadEffector=1
; cap per hit
MaxDamage=100000
; 1 = gem_contactdamage.log: install line + the first 40 hits (hp before/after, state)
Log=1
