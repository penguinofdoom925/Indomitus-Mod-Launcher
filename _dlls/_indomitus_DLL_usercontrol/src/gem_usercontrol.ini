[UserControl]
; 1 = a unit carrying the tag below is handed to its player at once:
;     brain control = user, AddTags added, the tag removed (replaces the 40k_triggers/user_control mission trigger)
Enabled=1
; the tag unit scripts add ({tags add "user_control"}); lowercase, one word
Tag=user_control
; tags added on hand-over (space separated, case kept)
AddTags=player _user
; 1 = a unit owned by a bot player is NOT handed over (its tag is just removed, it stays AI controlled, no player/_user tags)
; 0 = bots' units are handed over too (what the battle zones trigger did: it never looked at the owner)
SkipBots=1
; owner numbers that are never handed over, e.g. SkipPlayers=0 (what the conquest trigger did: player 0 = hostile AI)
SkipPlayers=
; owner is neither a known human nor a known bot (editor, no MP player list): 1 = hand over, 0 = only remove the tag
UnknownOwner=1
; unit has no owner when it is tagged: 0 = keep the tag and hand over when the owner is set, 1 = hand over right away
NoOwner=0
; 1 = the {tags} hook goes in on the first owner change instead of at start-up (other dlls read that code at start-up)
LateTagsHook=1
; 1 = one log line per handled unit in gem_usercontrol.log (a few per match)
Log=1
