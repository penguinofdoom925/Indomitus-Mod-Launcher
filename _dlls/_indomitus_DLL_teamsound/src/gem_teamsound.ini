[TeamSound]
; 1 = rewrite the token in {play_sound} link names and {start_sound} paths per player
Enabled=1
; text replaced in the link name / sound path
Token=@side
; word used for the player who owns the entity, his allies, his enemies,
; and when the owner or the local player is unknown (spectator, editor, ownerless dummy)
OwnWord=ally
AllyWord=ally
EnemyWord=enemy
NeutralWord=neutral
; 1 = when the entity has no player, use the effector's player
UseEffector=1
; 1 = log every rewrite (owner, local player, relation) to gem_teamsound.log
Log=0
; 0.2: the listener's army. A script line {play_sound "@army=ig"} on one of the local player's own
; entities records his army (never played). "@army" in a name becomes that word; "@who" becomes
; enemy_<army> for enemies of the entity's owner, else the ally / own / neutral word.
ArmyHint=@army=
ArmyToken=@army
WhoToken=@who
; army word used until a hint was seen for the local player
ArmyDefault=ig
; 0.2.1: {play_sound "@army!tg"} = army forced by the mission script (conquest), no owner test;
; for ForceHoldMs after it the per-unit ArmyHint lines are ignored
ArmyForce=@army!
ForceHoldMs=60000
; 0.3: 1 = read the local player's army from the engine's own player record (what a bot's BotApi.Instance.army
; comes from). The script hints above are only the fallback when the record is missing.
EngineArmy=1
